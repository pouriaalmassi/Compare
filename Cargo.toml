[package]
name = "diffitrust"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "0.13", features = ["svg", "canvas", "tokio"] }
similar = { version = "3.2", features = ["inline"] }
rfd = "0.17"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dark-light = "1.1"


[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[patch.crates-io]
block = { path = "patches/block" }



